<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión · tilca</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; color: #17191E; background: #F4F5F7; }
  main { max-width: 360px; padding: 24px; background: #fff; border: 1px solid #E4E6EA; border-radius: 12px; margin: 16px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #4B505A; line-height: 1.5; margin: 0 0 16px; }
  button { height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: #D1006B; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>No tienes conexión</h1>
  <p>Necesitas internet para ver los eventos de esta semana. Revisa tu conexión e inténtalo de nuevo.</p>
  <button type="button" onclick="location.reload()">Intentar de nuevo</button>
</main>
</body>
</html>
